[build]
  publish = "."
  command = "node fetch-images.js && node inject-images.js"

[build.environment]
  UNSPLASH_ACCESS_KEY = "d06e76cc942e40958bc345653ec45dee"

[[redirects]]
  from = "/blog"
  to   = "/blog.html"
  status = 200

[[redirects]]
  from = "/games"
  to   = "/games.html"
  status = 200

[[redirects]]
  from = "/about"
  to   = "/about.html"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

[[redirects]]
  from = "/game"
  to   = "/game.html"
  status = 200

[[redirects]]
  from = "/pixeljumper"
  to   = "/pixeljumper.html"
  status = 200

[[redirects]]
  from = "/posts/:slug"
  to   = "/posts/:slug.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
