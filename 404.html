<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="author" content="PixelWeirdo by Pixelated Wisdom"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page Not Found — PixelWeirdo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .not-found {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 32px;
    }
    .nf-code {
      font-family: var(--font-px);
      font-size: clamp(3rem, 10vw, 6rem);
      color: var(--accent);
      margin-bottom: 8px;
      line-height: 1;
    }
    .nf-title {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--ink);
    }
    .nf-sub {
      font-size: 1.05rem;
      color: var(--ink2);
      margin-bottom: 40px;
      max-width: 460px;
      line-height: 1.7;
    }
    .nf-pixel {
      font-family: var(--font-px);
      font-size: 0.38rem;
      color: var(--ink3);
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>
<script src="js/header.js"></script>

<div class="not-found">
  <div class="nf-code">404</div>
  <div class="nf-pixel">GAME OVER</div>
  <h1 class="nf-title">This page doesn't exist.</h1>
  <p class="nf-sub">Unlike a Souls game, there is nothing to learn from this death. The page you are looking for simply is not here.</p>
  <a href="index.html" class="btn-primary" style="display:inline-block;padding:13px 28px;font-size:0.875rem;font-weight:500;background:var(--accent);color:#fff;border:2px solid var(--accent);text-decoration:none">← Back to Home</a>
</div>

<script src="js/footer.js"></script>
</body>
</html>
